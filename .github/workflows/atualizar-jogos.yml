name: Atualizar Jogos (3x ao Dia)

on:
  schedule:
    # Roda às 00:00, 08:00 e 16:00 (Horário UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite rodar manualmente clicando no botão

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Instalar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Instalar dependências
      run: npm install axios

    - name: Rodar script de download
      # Aumentamos o timeout do passo para 15 minutos caso a API esteja lenta
      timeout-minutes: 15
      run: node scripts/update-db.js

    - name: Verificar mudanças e Enviar
      run: |
        git config --global user.name 'Atualizador Automático'
        git config --global user.email 'actions@github.com'
        
        # AQUI ESTAVA O ERRO: Agora usamos 'git add .' para pegar TUDO (incluindo a pasta details)
        git add .
        
        # Só faz o commit se houver mudanças reais
        if git diff --staged --quiet; then
          echo "Nenhuma mudança detectada nos jogos."
        else
          git commit -m "Atualização automática: Jogos e Detalhes [skip ci]"
          git push
        fi
